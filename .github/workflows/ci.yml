name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.25.14-trixie@sha256:2c4c60ef415fbfa5e90300722293bef36c5e63fae17570ce18f580af933dbd73
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: bytedown
          POSTGRES_DB: bytedown_test
          # Isolated disposable CI service, never a deployment setting.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U bytedown -d bytedown_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://bytedown@postgres:5432/bytedown_test?sslmode=disable
      VIPS_CONCURRENCY: "1"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libvips-dev liblcms2-dev pkg-config libheif-plugin-aomenc libheif-plugin-aomdec
      - run: go test ./...
      - run: go vet ./...
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Example HTTP contract checks
        run: node examples/test-examples.mjs
      - run: docker build --tag bytedown:ci .
      - name: Native encoder probe in the non-root runtime
        run: docker run --rm --entrypoint /usr/local/bin/bytedown bytedown:ci probe
